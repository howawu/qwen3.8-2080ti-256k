    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="3.0s" repeatCount="indefinite"/>
  </g>

  <!-- Road -->
  <rect x="0" y="380" width="800" height="70" fill="#616161"/>

  <!-- Scrolling lane markings -->
  <g>
    <use href="#lane-period"/>
    <use href="#lane-period" x="800"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="3.0s" repeatCount="indefinite"/>
  </g>

  <!-- Bicycle -->
  <g>
    <g>
