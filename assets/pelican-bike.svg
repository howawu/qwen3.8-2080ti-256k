      <line x1="390" y1="322" x2="428" y2="322" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <line x1="390" y1="322" x2="352" y2="322" stroke="#555" stroke-width="5" stroke-linecap="round"/>
